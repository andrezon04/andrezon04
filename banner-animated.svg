<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="title desc">
  <title id="title">André Dias</title>
  <desc id="desc">Desenvolvimento de Sistemas. Java, Spring Boot e React. Ondas suaves em azul e roxo.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="0.5"><stop stop-color="#1a1b27"/><stop offset="1" stop-color="#292e52"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="190" rx="16"/></clipPath>
  </defs>
  <style>
    .wave { animation: drift 28s linear infinite; }
    .wave-front { animation-duration: 36s; animation-direction: reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="190" fill="url(#bg)"/>
    <path class="wave" d="M-600 154 Q-450 124 -300 154 T0 154 T300 154 T600 154 T900 154 T1200 154 T1500 154 T1800 154 V190 H-600Z" fill="#7aa2f7" opacity="0.2"/>
    <path class="wave wave-front" d="M-600 170 Q-450 146 -300 170 T0 170 T300 170 T600 170 T900 170 T1200 170 T1500 170 T1800 170 V190 H-600Z" fill="#bb9af7" opacity="0.32"/>
  </g>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">André Dias</text>
  <text x="600" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#a9b1d6">Desenvolvimento de Sistemas · Java · Spring Boot · React</text>
</svg>
